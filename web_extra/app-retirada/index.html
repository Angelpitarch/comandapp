<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComandApp</title>
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="../marca/favicon-64.png">
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: radial-gradient(120% 80% at 0% 0%, #1d1608 0%, #0d0d0d 55%) #0d0d0d; color: #f4f1ec;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 440px; }
    img { width: 260px; max-width: 80%; }
    h1 { font-size: 24px; margin: 28px 0 10px; }
    p { color: #c9c2b9; line-height: 1.5; margin: 0 0 22px; }
    a { display: inline-block; background: #fcac0c; color: #111; font-weight: 700; text-decoration: none; padding: 12px 22px; border-radius: 12px; }
  </style>
</head>
<body>
  <main>
    <img src="../marca/logo-horizontal.png" alt="ComandApp">
    <h1>La app ahora está solo en teléfonos y tabletas</h1>
    <p>Meseros y cocina entran con la app ComandApp instalada en Android. Si eres administrador, usa el panel.</p>
    <a href="../">Ir al panel de administración</a>
  </main>
  <script>
    // Quita la version anterior guardada por el navegador (la app web ya no existe).
    try { navigator.serviceWorker?.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())); } catch (e) {}
    try { caches?.keys().then((ks) => ks.forEach((k) => caches.delete(k))); } catch (e) {}
  </script>
</body>
</html>

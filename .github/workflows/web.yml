name: Pagina web

# Publica en GitHub Pages el panel de administracion (carpeta admin/, HTML y JavaScript sin compilar).
# Meseros y cocina usan la app ComandApp en Android; la app ya no se publica para navegador.
# En /app/ queda un aviso que lleva al panel (para quien tenga guardada la direccion vieja).
# Se ejecuta sola cada vez que cambia el panel en main, o a mano desde Actions.
on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'assets/marca/**'
      - 'web_extra/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pagina-web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Juntar el panel
        run: |
          rm -rf _site && mkdir -p _site/marca _site/app
          cp -r admin/. _site/
          cp -r assets/marca/. _site/marca/
          cp logo.png _site/logo.png
          cp web_extra/app-retirada/index.html _site/app/index.html
          ls -la _site _site/marca

      - name: Preparar publicacion
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: publicar
        uses: actions/deploy-pages@v4
